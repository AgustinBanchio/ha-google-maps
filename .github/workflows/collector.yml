name: Collector
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        run: python -m pip install uv==0.13.1
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run --frozen python -m google_maps_collector --help
      - run: uv run --frozen pytest -q
  broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Disposable broker suite
        run: docker compose -f deploy/compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Remove disposable project
        if: always()
        run: docker compose -f deploy/compose.test.yaml down --volumes

  native-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Protected upstream modules and update simulation
        run: |
          python tools/check_upstream.py
          python tools/test_upstream_rebase.py
      - name: Original HA entities and external source contract
        run: docker run --rm --network none --entrypoint python --workdir /repo -e HA_NATIVE_SOURCE=/repo -v "$PWD:/repo:ro" ghcr.io/home-assistant/home-assistant:2026.10.1@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0 /repo/tests/native/run_tests.py
