name: google-maps-collector-test
services:
  broker:
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    user: "1883:1883"
    entrypoint: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto.acl:/mosquitto/config/mosquitto.acl:ro
      - ./test/broker-passwords:/run/secrets/broker-passwords:ro
    tmpfs: [/mosquitto/data:uid=1883,gid=1883,mode=0700]
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-u", "collector", "-P", "synthetic-collector-password", "-t", "google_maps_collector/test/health", "-m", "ready", "-q", "1"]
      interval: 2s
      timeout: 3s
      retries: 15
  tests:
    build:
      context: ..
      dockerfile: deploy/test/Dockerfile
    environment:
      BROKER_TEST_HOST: broker
    depends_on:
      broker:
        condition: service_healthy
